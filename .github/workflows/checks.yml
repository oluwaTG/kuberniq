name: Build and regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: kuberniq-chat/api/requirements.txt
      - run: python -m pip install --require-hashes -r kuberniq-chat/api/requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s kuberniq-chat/tests -v
        env:
          PYTHON_DOTENV_DISABLED: '1'
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kuberniq-chat/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kuberniq-chat/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test kuberniq-server.tests/kuberniq-server.tests.csproj --configuration Release
      - run: dotnet build kuberniq/kuberniq.csproj --configuration Release
