name: Helm — Update image tag

on:
  # Called by kuberniq-server and kuberniq-chat workflows after a successful build
  workflow_call:
    inputs:
      chart:
        description: "Chart folder name under helm/Application/ (kuberniq-server or kuberniq-chat)"
        required: true
        type: string
      image_tag:
        description: "New image tag to write into the chart's values.yaml"
        required: true
        type: string

  # Also allow manual runs for one-off updates
  workflow_dispatch:
    inputs:
      chart:
        description: "Chart folder name (kuberniq-server or kuberniq-chat)"
        required: true
        type: choice
        options:
          - kuberniq-server
          - kuberniq-chat
      image_tag:
        description: "Image tag to set (e.g. 1.0.8)"
        required: true
        type: string

jobs:
  lint:
    name: Lint ${{ inputs.chart }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint helm/Application/${{ inputs.chart }}

  update-values:
    name: Update image tag in values.yaml
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use a PAT so the commit triggers downstream workflows if needed
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image.tag in values.yaml
        run: |
          FILE="helm/Application/${{ inputs.chart }}/values.yaml"
          # Replace the tag value under the image block
          sed -i "s/^\(  tag:\s*\)\".*\"/\1\"${{ inputs.image_tag }}\"/" "$FILE"
          echo "Updated $FILE → tag: ${{ inputs.image_tag }}"
          grep "tag:" "$FILE"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/Application/${{ inputs.chart }}/values.yaml
          git commit -m "chore(helm): update ${{ inputs.chart }} image tag to ${{ inputs.image_tag }} [skip ci]"
          git push
