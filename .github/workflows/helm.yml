name: Helm — Lint & Package

on:
  push:
    branches: [main]
    paths:
      - "helm/**"
    tags:
      - "helm/v*.*.*"
  pull_request:
    paths:
      - "helm/**"
  workflow_dispatch:

jobs:
  lint:
    name: Lint charts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint kuberniq-server
        run: helm lint helm/Application/kuberniq-server

      - name: Lint kuberniq-chat
        run: helm lint helm/Application/kuberniq-chat

  package:
    name: Package & upload charts
    needs: lint
    runs-on: ubuntu-latest
    # Only package on tag pushes
    if: startsWith(github.ref, 'refs/tags/helm/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "❌ Tag must be on the main branch. Aborting."
            exit 1
          fi
          echo "✅ Tag is on main."

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package charts
        run: |
          mkdir -p packaged-charts
          helm package helm/Application/kuberniq-server -d packaged-charts
          helm package helm/Application/kuberniq-chat   -d packaged-charts

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#helm/}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Helm Charts ${{ steps.version.outputs.VERSION }}
          tag_name: ${{ github.ref_name }}
          files: packaged-charts/*.tgz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
