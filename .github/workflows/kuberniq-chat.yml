name: kuberniq-chat — Build & Push

on:
  push:
    branches: [main]
    paths:
      - "kuberniq-chat/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      new_version: ${{ steps.tag.outputs.new_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Auto-increments semver based on conventional commits:
      #   fix: → patch bump (1.0.0 → 1.0.1)
      #   feat: → minor bump (1.0.0 → 1.1.0)
      #   BREAKING CHANGE → major bump (1.0.0 → 2.0.0)
      - name: Bump version and create tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: "chat-v"
          default_bump: patch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./kuberniq-chat
          file: ./kuberniq-chat/Dockerfile
          push: true
          # Tag with both the exact semver (e.g. 1.0.1) and latest
          tags: |
            elumole22/kuberniq-chat:${{ steps.tag.outputs.new_version }}
            elumole22/kuberniq-chat:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-helm:
    needs: build-and-push
    uses: ./.github/workflows/helm.yml
    with:
      chart: kuberniq-chat
      image_tag: ${{ needs.build-and-push.outputs.new_version }}
    secrets: inherit
