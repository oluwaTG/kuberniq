name: kuberniq-chat — Build & Push

on:
  push:
    branches:
      - main
    paths:
      - "kuberniq-chat/**"
  workflow_dispatch:

jobs:
  # ── 1. Read version from VERSION file, push tag (skip if tag already exists) ─
  tag:
    name: Tag version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      tag:     ${{ steps.version.outputs.TAG }}
      skip:    ${{ steps.check.outputs.SKIP }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from kuberniq-chat/VERSION
        id: version
        run: |
          VERSION=$(cat kuberniq-chat/VERSION | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "❌ Could not read version from kuberniq-chat/VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION"     >> "$GITHUB_OUTPUT"
          echo "TAG=chat/v$VERSION"   >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check
        run: |
          TAG="chat/v${{ steps.version.outputs.VERSION }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "⚠️  Tag $TAG already exists — this push did not bump the version. Skipping release."
            echo "SKIP=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ New version detected: $TAG"
            echo "SKIP=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push tag
        if: steps.check.outputs.SKIP == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.TAG }}"
          git push origin "${{ steps.version.outputs.TAG }}"
          echo "🏷️  Pushed ${{ steps.version.outputs.TAG }}"

  # ── 2. Build & push Docker image ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker image
    needs: tag
    if: needs.tag.outputs.skip == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: elumole22/kuberniq-chat
          tags: |
            type=raw,value=${{ needs.tag.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./kuberniq-chat
          file: ./kuberniq-chat/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
