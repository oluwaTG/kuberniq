name: kuberniq-chat — Build & Push

on:
  push:
    tags:
      - "chat/v*.*.*"
    paths:
      - "kuberniq-server/**"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # - name: Verify tag is on main
      #   run: |
      #     git fetch origin main
      #     if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
      #       echo "❌ Tag must be on the main branch. Aborting."
      #       exit 1
      #     fi
      #     echo "✅ Tag is on main."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Derives tags from the git tag, e.g. chat/v1.2.3 → 1.2.3, 1.2, 1, latest
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: elumole22/kuberniq-chat
          tags: |
            type=match,pattern=chat/v(.*),group=1
            type=match,pattern=chat/v(\d+\.\d+),group=1
            type=match,pattern=chat/v(\d+),group=1
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./kuberniq-chat
          file: ./kuberniq-chat/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
