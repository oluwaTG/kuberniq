name: kuberniq CLI — Release

on:
  push:
    branches: [main]
    paths:
      - "kuberniq/**"

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: osx-arm64
            artifact: kuberniq-macos-arm64
          - rid: osx-x64
            artifact: kuberniq-macos-x64
          - rid: linux-x64
            artifact: kuberniq-linux-x64
          - rid: win-x64
            artifact: kuberniq-win-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Auto-increments semver based on conventional commits.
      # Only runs once (on the first matrix leg) to avoid duplicate tags.
      - name: Bump version and create tag
        id: tag
        if: matrix.rid == 'linux-x64'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: "cli-v"
          default_bump: patch

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Publish ${{ matrix.rid }}
        run: |
          dotnet publish kuberniq/kuberniq.csproj \
            -r ${{ matrix.rid }} \
            -c Release \
            -o dist/${{ matrix.rid }}

      - name: Rename binary
        run: |
          SRC=dist/${{ matrix.rid }}/kuberniq
          [ -f "${SRC}.exe" ] && SRC="${SRC}.exe"
          mv "$SRC" dist/${{ matrix.rid }}/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.rid }}/${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Re-run the tag action to read the version that was already created above
      - name: Read current CLI version
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: "cli-v"
          default_bump: patch
          dry_run: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: kuberniq CLI ${{ steps.tag.outputs.new_version }}
          tag_name: cli-v${{ steps.tag.outputs.new_version }}
          files: release-assets/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
