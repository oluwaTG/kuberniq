name: kuberniq CLI — Release

on:
  push:
    branches:
      - main
    paths:
      - "kuberniq/**"
  workflow_dispatch:

jobs:
  # ── 1. Read version from csproj, push tag (skip if tag already exists) ───────
  tag:
    name: Tag version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      tag:     ${{ steps.version.outputs.TAG }}
      skip:    ${{ steps.check.outputs.SKIP }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from kuberniq.csproj
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' kuberniq/kuberniq.csproj)
          if [ -z "$VERSION" ]; then
            echo "❌ Could not read <Version> from kuberniq/kuberniq.csproj"
            exit 1
          fi
          echo "VERSION=$VERSION"      >> "$GITHUB_OUTPUT"
          echo "TAG=cli/v$VERSION"     >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check
        run: |
          TAG="cli/v${{ steps.version.outputs.VERSION }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "⚠️  Tag $TAG already exists — this push did not bump the version. Skipping release."
            echo "SKIP=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ New version detected: $TAG"
            echo "SKIP=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push tag
        if: steps.check.outputs.SKIP == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.TAG }}"
          git push origin "${{ steps.version.outputs.TAG }}"
          echo "🏷️  Pushed ${{ steps.version.outputs.TAG }}"

  # ── 2. Build all platform binaries ───────────────────────────────────────────
  build:
    name: Build ${{ matrix.rid }}
    needs: tag
    if: needs.tag.outputs.skip == 'false'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: osx-arm64
            artifact: kuberniq-macos-arm64
          - rid: osx-x64
            artifact: kuberniq-macos-x64
          - rid: linux-x64
            artifact: kuberniq-linux-x64
          - rid: win-x64
            artifact: kuberniq-win-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Publish ${{ matrix.rid }}
        run: |
          dotnet publish kuberniq/kuberniq.csproj \
            -r ${{ matrix.rid }} \
            -c Release \
            -o dist/${{ matrix.rid }}

      - name: Rename binary
        run: |
          SRC=dist/${{ matrix.rid }}/kuberniq
          [ -f "${SRC}.exe" ] && SRC="${SRC}.exe"
          mv "$SRC" dist/${{ matrix.rid }}/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.rid }}/${{ matrix.artifact }}

  # ── 3. Publish GitHub Release ─────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [tag, build]
    if: needs.tag.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: kuberniq CLI ${{ needs.tag.outputs.version }}
          tag_name: ${{ needs.tag.outputs.tag }}
          files: release-assets/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
