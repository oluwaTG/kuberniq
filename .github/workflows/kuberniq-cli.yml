name: kuberniq CLI — Release

on:
  push:
    tags:
      - "cli/v*.*.*"
    branches:
      - main
    paths:
      - "kuberniq/**"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: osx-arm64
            artifact: kuberniq-macos-arm64
          - rid: osx-x64
            artifact: kuberniq-macos-x64
          - rid: linux-x64
            artifact: kuberniq-linux-x64
          - rid: win-x64
            artifact: kuberniq-win-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "❌ Tag must be on the main branch. Aborting."
            exit 1
          fi
          echo "✅ Tag is on main."

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Publish ${{ matrix.rid }}
        run: |
          dotnet publish kuberniq/kuberniq.csproj \
            -r ${{ matrix.rid }} \
            -c Release \
            -o dist/${{ matrix.rid }}

      - name: Rename binary
        run: |
          SRC=dist/${{ matrix.rid }}/kuberniq
          # Windows output already has .exe
          [ -f "${SRC}.exe" ] && SRC="${SRC}.exe"
          mv "$SRC" dist/${{ matrix.rid }}/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.rid }}/${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/cli/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#cli/}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: kuberniq CLI ${{ steps.version.outputs.VERSION }}
          tag_name: ${{ github.ref_name }}
          files: release-assets/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
