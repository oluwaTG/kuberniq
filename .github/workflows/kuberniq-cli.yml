name: kuberniq CLI — Release

on:
  push:
    branches: [main]
    paths:
      - "kuberniq/**"

permissions:
  contents: write

jobs:
  version:
    name: Bump version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.tag.outputs.new_version }}
      new_tag: ${{ steps.tag.outputs.new_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and create tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: "cli-v"
          default_bump: patch

  build:
    name: Build ${{ matrix.rid }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: osx-arm64
            artifact: kuberniq-macos-arm64
          - rid: osx-x64
            artifact: kuberniq-macos-x64
          - rid: linux-x64
            artifact: kuberniq-linux-x64
          - rid: win-x64
            artifact: kuberniq-win-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Publish ${{ matrix.rid }}
        run: |
          dotnet publish kuberniq/kuberniq.csproj \
            -r ${{ matrix.rid }} \
            -c Release \
            -o dist/${{ matrix.rid }}

      - name: Rename binary
        run: |
          SRC=dist/${{ matrix.rid }}/kuberniq
          [ -f "${SRC}.exe" ] && SRC="${SRC}.exe"
          mv "$SRC" dist/${{ matrix.rid }}/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.rid }}/${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: kuberniq CLI ${{ needs.version.outputs.new_version }}
          tag_name: ${{ needs.version.outputs.new_tag }}
          files: release-assets/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
