{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mcp-chatbot.fullname" . }}-secrets-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-chatbot.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mcp-chatbot.fullname" . }}-secrets-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-chatbot.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mcp-chatbot.fullname" . }}-secrets-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "mcp-chatbot.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
