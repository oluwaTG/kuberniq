# ------------------------------------------------------------------------------
# General
# ------------------------------------------------------------------------------
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

# ------------------------------------------------------------------------------
# Image
# ------------------------------------------------------------------------------
image:
  repository: elumole22/kuberniq-chat
  tag: "latest"
  pullPolicy: Always

imagePullSecrets: []

# ------------------------------------------------------------------------------
# Service Account
# ------------------------------------------------------------------------------
serviceAccount:
  create: true
  annotations: {}
  name: ""

# ------------------------------------------------------------------------------
# RBAC
# ------------------------------------------------------------------------------
# Creates a Role + RoleBinding so the pod's service account can manage Secrets
# in its own namespace (required for the JWT key, user store, refresh tokens).
rbac:
  create: true

# ------------------------------------------------------------------------------
# Pod metadata
# ------------------------------------------------------------------------------
podAnnotations: {}
podLabels: {}

# ------------------------------------------------------------------------------
# Security contexts
# ------------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false   # Streamlit writes tmp files at runtime
  capabilities:
    drop:
      - ALL

# ------------------------------------------------------------------------------
# Service
# ------------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8501
  targetPort: 8501

# ------------------------------------------------------------------------------
# Ingress
# ------------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: mcp-chatbot.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: mcp-chatbot-tls
  #   hosts:
  #     - mcp-chatbot.example.com

# ------------------------------------------------------------------------------
# Resources
# ------------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ------------------------------------------------------------------------------
# Health probes
# Streamlit exposes a /_stcore/health endpoint
# ------------------------------------------------------------------------------
livenessProbe:
  enabled: true
  path: /_stcore/health
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /_stcore/health
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# ------------------------------------------------------------------------------
# Application config
# ------------------------------------------------------------------------------
mcpServerUrl: "http://kuberniq-server.kuberniq-server.svc.cluster.local:8080"

# ------------------------------------------------------------------------------
# MCP Server authentication
# ------------------------------------------------------------------------------
# Three modes — pick one, leave the others empty/commented:
#
# MODE 1 — Kubernetes Secret (recommended for production):
#   kubectl create secret generic kuberniq-chat-mcp-auth \
#     --from-literal=username=kuberniq-chat \
#     --from-literal=password=<strong-password> \
#     -n <release-namespace>
#   Then set:  mcpAuth.secretName: "kuberniq-chat-mcp-auth"
#
# MODE 2 — Plain env values (dev / external secret provider already injected):
#   Set secretName: "" and fill username + password directly.
#   Works with tools like Vault Agent, ESO, or Helm --set overrides.
#
# MODE 3 — Skip here, supply via mcpAuth.secretName: "" and add MCP_USERNAME /
#   MCP_PASSWORD yourself under the `env:` block below (e.g. from a
#   SecretProviderClass sync or an ExternalSecret).
mcpAuth:
  # K8s Secret name — if set, takes priority over plain username/password below.
  # Set to "" to use plain values or the env: block instead.
  secretName: ""                          # e.g. "kuberniq-chat-mcp-auth"
  usernameKey: "username"
  passwordKey: "password"

  # Plain values — used only when secretName is empty.
  # Leave blank to supply MCP_USERNAME/MCP_PASSWORD via the env: block.
  username: ""                            # e.g. "kuberniq-chat"
  password: ""                            # e.g. "utNoJnJwqJQBG6YAoyzCSnws"

# Pass OPENAI_API_KEY however suits your setup — plain value, secretKeyRef,
# Azure Key Vault CSI, or any other valueFrom source.
# Examples:
#
# Plain value (dev / local testing):
#   env:
#     - name: OPENAI_API_KEY
#       value: "sk-..."
#
# Kubernetes Secret:
#   env:
#     - name: OPENAI_API_KEY
#       valueFrom:
#         secretKeyRef:
#           name: mcp-chatbot-secrets
#           key: OPENAI_API_KEY
#
# Azure Key Vault (CSI driver — mounts secret as env var via SecretProviderClass):
#   env:
#     - name: OPENAI_API_KEY
#       valueFrom:
#         secretKeyRef:
#           name: mcp-chatbot-akv-sync   # synced by the CSI driver
#           key: OPENAI_API_KEY
env:
  - name: OPENAI_API_KEY
    value: "replace-me"

# OpenAI model — override per environment (e.g. gpt-4o-mini for cost saving)
openaiModel: "gpt-4o"

# Set to "true" to show the Raw MCP data panel in the UI (local dev only)
debugMcp: "false"

# ------------------------------------------------------------------------------
# Scheduling
# ------------------------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}
