apiVersion: v2
name: kuberniq-server
description: >
  Kuberniq Server — a read-only Kubernetes API backend.
  Exposes cluster resources via REST, enables multi-cluster routing via
  ?cluster=<name>, powers the Kuberniq Chat AI assistant, and includes
  JWT-based local auth with optional OIDC/SSO (Entra ID, Okta, etc.).
type: application
version: 1.1.1
appVersion: "1.1.1"

keywords:
  - kubernetes
  - kuberniq
  - dashboard
  - devops
  - ai

home: https://github.com/oluwaTG/kuberniq

sources:
  - https://github.com/oluwaTG/kuberniq

maintainers:
  - name: elumole22
    url: https://github.com/elumole22
